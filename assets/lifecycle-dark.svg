<svg xmlns="http://www.w3.org/2000/svg" width="960" height="389" viewBox="0 0 960 389" role="img" aria-label="Ciclo de una request en GoNext, diseño propuesto: request, middleware, guard, binding, controller, provider y response. Guard y binding llegan en la etapa 2. Si el guard rechaza, responde 403 y el controller no corre."><style>@font-face{font-family:GN;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GN;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:GN,ui-monospace,Menlo,Consolas,monospace;font-size:14.2857px;fill:#e6e1d6;white-space:pre}.ink{fill:#e6e1d6}.dim{fill:#868e9b}.cyan{fill:#00add8}.amber{fill:#e0a84f}.px{fill:#e6e1d6}.px.go{fill:#00add8}.ghost{fill:#1e2127}.seam{stroke:#2a2e35;stroke-width:1;fill:none}.wire{stroke:#868e9b;stroke-width:1;fill:none}.axis{stroke:#868e9b;stroke-width:2}.node{fill:#16181d;stroke:#e6e1d6;stroke-width:2}.node.own{fill:#e6e1d6}.node.later{stroke:#868e9b;stroke-dasharray:2 2}.err{stroke:#e0a84f;stroke-width:1.5;fill:none;stroke-dasharray:3 3}</style><rect x="0.5" y="0.5" width="959" height="388" rx="10" fill="#16181d" stroke="#2b2f37"/><text x="40" y="28.2"><tspan class="amber" font-weight="700">diseño propuesto</tspan></text><rect class="node" x="244" y="18.2" width="12" height="12"/><text x="270" y="28.2"><tspan class="dim">framework</tspan></text><rect class="node own" x="384" y="18.2" width="12" height="12"/><text x="410" y="28.2"><tspan class="dim">tu código</tspan></text><text x="550" y="28.2"><tspan class="amber">etapa 2</tspan><tspan class="dim"> = más adelante</tspan></text><path class="seam" d="M1 41H959"/><path class="axis" d="M60 72.6V358.6"/><rect class="node" x="54" y="66.6" width="12" height="12"/><text x="90" y="76.6"><tspan class="ink" font-weight="700">request</tspan></text><text x="230" y="76.6"><tspan class="cyan" font-weight="700">GET </tspan><tspan class="cyan">/users/42</tspan></text><text x="790" y="76.6"><tspan class="dim">*ht